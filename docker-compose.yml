services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_sales_postgres
    environment:
      POSTGRES_DB: enterprise_sales
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d enterprise_sales"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: enterprise_sales_api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: enterprise_sales_dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
